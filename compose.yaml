name: commander

x-environment: &environment
  BUS_URL: ${BUS_URL:-amqp://${RABBITMQ_USER:-commander}:${RABBITMQ_PASSWORD:-commander-local-secret}@rabbitmq:5672/}
  STORAGE_URL: ${STORAGE_URL:-s3://commander}
  AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-http://minio:9000}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-commander}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-commander-local-secret}
  S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}

x-runtime: &runtime
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-agent: &agent
  <<: *runtime
  pull_policy: never
  environment: *environment
  depends_on:
    controller:
      condition: service_started
    rabbitmq:
      condition: service_healthy

services:
  secrets-key:
    image: commander-api:local
    pull_policy: never
    user: "0:1000"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        fail() { printf '%s\n' "$$1" >&2; exit 1; }
        valid_key() {
          case "$$1" in ''|*[!0-9a-fA-F]*) return 1 ;; esac
          [ "$${#1}" -eq 64 ]
        }
        chgrp 1000 /run/commander-secrets
        chmod 750 /run/commander-secrets
        key_file=/run/commander-secrets/key
        key="$$SECRETS_ENCRYPTION_KEY"
        if [ -n "$$key" ]; then
          valid_key "$$key" || fail 'SECRETS_ENCRYPTION_KEY must contain 64 hex characters.'
          key="$$(printf '%s' "$$key" | tr 'A-F' 'a-f')"
        fi
        if [ -e "$$key_file" ] || [ -L "$$key_file" ]; then
          [ -f "$$key_file" ] && [ ! -L "$$key_file" ] || fail 'Invalid saved secrets key; restore the original key.'
          saved="$$(cat "$$key_file")"
          valid_key "$$saved" || fail 'Invalid saved secrets key; restore the original key.'
          saved="$$(printf '%s' "$$saved" | tr 'A-F' 'a-f')"
          [ -z "$$key" ] || [ "$$key" = "$$saved" ] || fail 'SECRETS_ENCRYPTION_KEY differs from the saved key. Use the original key; rotation requires re-encryption.'
        else
          key="$${key:-$$(openssl rand -hex 32)}"
          valid_key "$$key" || fail 'Could not generate a secrets encryption key.'
          temporary="$$(mktemp /run/commander-secrets/.key.XXXXXX)"
          trap 'rm -f "$$temporary"' EXIT
          printf '%s\n' "$$key" > "$$temporary"
          chmod 440 "$$temporary"
          mv "$$temporary" "$$key_file"
        fi
        chgrp 1000 "$$key_file"
        chmod 440 "$$key_file"
    environment:
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
    volumes:
      - secrets-key:/run/commander-secrets

  mcp-credentials:
    image: commander-mcp:local
    pull_policy: never
    user: "0:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        chgrp 1000 /run/commander
        chmod 750 /run/commander
        if [ -e /run/commander/mcp-token ] || [ -L /run/commander/mcp-token ]; then
          test -f /run/commander/mcp-token
          test -s /run/commander/mcp-token
          test ! -L /run/commander/mcp-token
        fi
        if [ -n "$$MCP_TOKEN" ] || [ ! -f /run/commander/mcp-token ]; then
          temporary="$$(mktemp /run/commander/.mcp-token.XXXXXX)"
          trap 'rm -f "$$temporary"' EXIT
          MCP_TOKEN="$${MCP_TOKEN:-$$(openssl rand -hex 32)}"
          export MCP_TOKEN
          commander-mcp credentials --raw > "$$temporary"
          chmod 440 "$$temporary"
          mv "$$temporary" /run/commander/mcp-token
        fi
    environment:
      MCP_TOKEN: ${MCP_TOKEN:-}
    volumes:
      - mcp-credentials:/run/commander

  rabbitmq:
    image: rabbitmq:4.2.9-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-commander}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-commander-local-secret}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 10s

  mongo:
    image: mongo:8.0.32
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      # Avoid MongoDB TCMalloc crashes on newer kernels: SERVER-121912.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongo:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status(); }
          catch (error) {
            if (error.codeName !== "NotYetInitialized") throw error;
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]});
          }
          quit(db.hello().isWritablePrimary ? 0 : 1);
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 5s

  minio:
    image: commander-minio:local
    build:
      context: ./providers/s3/tests/minio
      target: minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # Local development credentials; hosting supplies its own credentials.
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-commander}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-commander-local-secret}
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 5s

  minio-init:
    image: commander-minio-client:local
    build:
      context: ./providers/s3/tests/minio
      target: mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-commander}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-commander-local-secret}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$AWS_ACCESS_KEY_ID" "$$AWS_SECRET_ACCESS_KEY"
        mc mb --ignore-existing local/commander

  controller:
    <<: *runtime
    image: commander-controller:local
    pull_policy: never
    build:
      context: .
      dockerfile: apps/controllers/default/docker/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command:
      - --with-missions=/data/default-missions.json
    configs:
      - source: default-missions
        target: /data/default-missions.json
    environment:
      <<: *environment
      DATABASE_URL: ${DATABASE_URL:-mongodb://mongo:27017/commander?replicaSet=rs0}

  mcp:
    <<: *runtime
    # Keep MCP at PID 1 so the credentials command can read its environment.
    init: false
    entrypoint:
      - /bin/sh
      - -ec
      - |
        MCP_TOKEN="$${MCP_TOKEN:-$$(cat /run/commander/mcp-token)}"
        export MCP_TOKEN
        exec commander-mcp "$$@"
      - commander-mcp
    image: commander-mcp:local
    pull_policy: never
    build:
      context: .
      dockerfile: apps/adapters/mcp/docker/Dockerfile
    command:
      - --listen-address=:4273
      - --allowed-hosts=localhost,127.0.0.1,::1,mcp
    environment:
      <<: *environment
      DATABASE_URL: ${DATABASE_URL:-mongodb://mongo:27017/commander?replicaSet=rs0}
      MCP_TOKEN: ${MCP_TOKEN:-}
      MCP_RUNTIME: docker-compose
    ports:
      - "127.0.0.1:${COMMANDER_MCP_PORT:-4273}:4273"
    volumes:
      - mcp-credentials:/run/commander:ro
    depends_on:
      mcp-credentials:
        condition: service_completed_successfully
      controller:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:4273/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    <<: *runtime
    # Keep the API at PID 1 so the credentials command can read its environment.
    init: false
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        SECRETS_ENCRYPTION_KEY="$$(cat /run/commander-secrets/key)"
        test -n "$$SECRETS_ENCRYPTION_KEY"
        API_PASSWORD="$${API_PASSWORD:-$$(openssl rand -hex 32)}"
        export API_PASSWORD SECRETS_ENCRYPTION_KEY
        exec commander-api
    image: commander-api:local
    pull_policy: never
    build:
      context: .
      dockerfile: apps/adapters/api/docker/Dockerfile
    environment:
      <<: *environment
      DATABASE_URL: ${DATABASE_URL:-mongodb://mongo:27017/commander?replicaSet=rs0}
      API_USERNAME: ${API_USERNAME:-commander}
      API_PASSWORD: ${API_PASSWORD:-}
      API_RUNTIME: docker-compose
      API_LISTEN_ADDRESS: 0.0.0.0:4274
      API_ALLOWED_HOSTS: ${API_ALLOWED_HOSTS:-localhost,127.0.0.1,::1,api}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-http://localhost:${COMMANDER_UI_PORT:-4275},http://127.0.0.1:${COMMANDER_UI_PORT:-4275}}
      API_SWAGGER_ENABLED: ${API_SWAGGER_ENABLED:-false}
    ports:
      - "127.0.0.1:${COMMANDER_API_PORT:-4274}:4274"
    volumes:
      - secrets-key:/run/commander-secrets:ro
    depends_on:
      secrets-key:
        condition: service_completed_successfully
      controller:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:4274/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  ui:
    <<: *runtime
    read_only: true
    image: commander-admin-ui:local
    pull_policy: never
    build:
      context: .
      dockerfile: apps/admin/ui/docker/Dockerfile
    environment:
      UI_PUBLIC_ORIGIN: ${UI_PUBLIC_ORIGIN:-}
      UI_API_UPSTREAMS: localhost:${COMMANDER_API_PORT:-4274}=api:4274,127.0.0.1:${COMMANDER_API_PORT:-4274}=api:4274
    ports:
      - "127.0.0.1:${COMMANDER_UI_PORT:-4275}:4275"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--timeout=2", "http://127.0.0.1:4275/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  spawner-agent:
    <<: *agent
    image: commander-spawner-agent:local
    build:
      context: .
      dockerfile: apps/agents/spawner/docker/Dockerfile
    # Host Docker access belongs only to the spawner, never its child agents.
    user: "0:0"
    environment:
      <<: *environment
      SPAWNER_RUNTIME: docker
      SPAWNER_STATE_DIR: /var/lib/commander/spawner
      SPAWNER_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-commander}_default
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - spawner-state:/var/lib/commander/spawner
    depends_on:
      controller:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  playground:
    profiles: [playground]
    build:
      context: .
      dockerfile: apps/playground/docker/Dockerfile
    init: true
    stdin_open: true
    tty: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint:
      - /bin/sh
      - -ec
      - |
        COMMANDER_MCP_TOKEN="$${COMMANDER_MCP_TOKEN:-$$(cat /run/commander/mcp-token)}"
        export COMMANDER_MCP_TOKEN
        exec commander "$$@"
      - commander
    environment:
      COMMANDER_MCP_URL: http://mcp:4273/mcp
      COMMANDER_MCP_TOKEN: ${COMMANDER_MCP_TOKEN:-${MCP_TOKEN:-}}
      COMMANDER_ADMIN_URL: ${COMMANDER_ADMIN_URL:-http://localhost:${COMMANDER_UI_PORT:-4275}}
      COMMANDER_LLM_PROVIDER: ${COMMANDER_LLM_PROVIDER:-}
      COMMANDER_LLM_MODEL: ${COMMANDER_LLM_MODEL:-}
      COMMANDER_LLM_BASE_URL: ${COMMANDER_LLM_BASE_URL:-}
      COMMANDER_LLM_API_KEY: ${COMMANDER_LLM_API_KEY:-}
      COMMANDER_DEBUG: ${COMMANDER_DEBUG:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      NO_COLOR: ${NO_COLOR:-}
      TERM: ${TERM:-xterm-256color}
    volumes:
      - mcp-credentials:/run/commander:ro
    depends_on:
      mcp-credentials:
        condition: service_completed_successfully
      mcp:
        condition: service_healthy
      spawner-agent:
        condition: service_started

volumes:
  secrets-key:
  spawner-state:
  mcp-credentials:
  rabbitmq:
  minio:
  mongo:

configs:
  default-missions:
    file: ./apps/controllers/default/data/default-missions.json
