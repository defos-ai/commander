name: commander-test

x-environment: &environment
  BUS_URL: file:///state/bus
  STORAGE_URL: file:///state/storage
  LOG_LEVEL: info
  LOG_FORMAT: json

x-runtime: &runtime
  init: true
  stop_grace_period: 30s
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-agent: &agent
  <<: *runtime
  pull_policy: never
  command: ["--heartbeat-interval=1s"]
  volumes:
    - bus:/state/bus
    - storage:/state/storage
  environment: *environment
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    controller:
      condition: service_started

services:
  volume-init:
    image: commander-controller:test
    pull_policy: never
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["chown"]
    command: ["1000:1000", "/bus", "/storage", "/database"]
    volumes:
      - bus:/bus
      - storage:/storage
      - database:/database

  controller:
    <<: *runtime
    image: commander-controller:test
    pull_policy: never
    build:
      context: ../..
      dockerfile: apps/controllers/default/docker/Dockerfile
    depends_on:
      volume-init:
        condition: service_completed_successfully
      fixture-releases:
        condition: service_healthy
    command: ["--with-missions=/fixtures/missions.json"]
    volumes:
      - bus:/state/bus
      - storage:/state/storage
      - database:/state/database
      - fixture-data:/fixtures:ro
    environment:
      <<: *environment
      DATABASE_URL: file:///state/database

  mcp:
    <<: *runtime
    image: commander-mcp:test
    pull_policy: never
    build:
      context: ../..
      dockerfile: apps/adapters/mcp/docker/Dockerfile
    command:
      - --listen-address=:4273
      - --allowed-hosts=localhost,127.0.0.1,::1,mcp
    volumes:
      - bus:/state/bus
      - storage:/state/storage
      - database:/state/database
    environment:
      <<: *environment
      DATABASE_URL: file:///state/database
      ENV: tests
      MCP_TOKEN: mcp-fixture-token
      MCP_RUNTIME: docker-compose
    ports:
      - "127.0.0.1:14273:4273"
    depends_on:
      controller:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:4273/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    <<: *runtime
    image: commander-api:test
    pull_policy: never
    build:
      context: ../..
      dockerfile: apps/adapters/api/docker/Dockerfile
    volumes:
      - bus:/state/bus
      - storage:/state/storage
      - database:/state/database
    environment:
      <<: *environment
      DATABASE_URL: file:///state/database
      ENV: tests
      API_USERNAME: api-fixture-user
      API_PASSWORD: api-fixture-password
      API_RUNTIME: docker-compose
      API_LISTEN_ADDRESS: 0.0.0.0:4274
      API_ALLOWED_HOSTS: localhost,127.0.0.1,::1,api,api-secondary
      API_ALLOWED_ORIGINS: http://localhost:14275,http://127.0.0.1:14275
      API_SWAGGER_ENABLED: "true"
      # Fixed fixture key, only for the isolated test stack.
      SECRETS_ENCRYPTION_KEY: 014ac583269fe047014ac583269fe047014ac583269fe047014ac583269fe047
    networks:
      default:
        aliases: [api-secondary]
    ports:
      - "127.0.0.1:14274:4274"
    depends_on:
      controller:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:4274/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  ui:
    <<: *runtime
    read_only: true
    profiles: [ui]
    image: commander-admin-ui:test
    pull_policy: never
    build:
      context: ../..
      dockerfile: apps/admin/ui/docker/Dockerfile
    environment:
      UI_API_UPSTREAMS: localhost:14274=api:4274,127.0.0.1:14274=api:4274,api-secondary:4274=api-secondary:4274
    ports:
      - "127.0.0.1:14275:4275"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--timeout=2", "http://127.0.0.1:4275/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  browser-agent:
    <<: *agent
    image: ghcr.io/defos-ai/commander-browser-agent:v0.2.0
    pull_policy: missing
    shm_size: 256mb
    environment:
      <<: *environment
      CHROMIUM_NO_SANDBOX: "true"

  web-agent-1:
    <<: *agent
    image: ghcr.io/defos-ai/commander-web-agent:v0.2.0
    pull_policy: missing

  web-agent-2:
    <<: *agent
    image: ghcr.io/defos-ai/commander-web-agent:v0.2.0
    pull_policy: missing

  spawner-agent:
    <<: *agent
    image: commander-spawner-agent:test
    command: ["--heartbeat-interval=1s", "--spawn-agents=https://github.com/defos-ai/fixture-agent"]
    build:
      context: ../..
      dockerfile: apps/agents/spawner/docker/Dockerfile
    environment:
      <<: *environment
      SPAWNER_RUNTIME: native
      SSL_CERT_FILE: /fixtures/ca.pem
    volumes:
      - bus:/state/bus
      - storage:/state/storage
      - fixture-data:/fixtures:ro

  # An isolated release endpoint exercises normal TLS, download and checksum
  # validation without a public GitHub release or resolver injection.
  fixture-releases:
    <<: *runtime
    image: commander-fixture-releases:test
    pull_policy: never
    build:
      context: ../..
      dockerfile: apps/agents/spawner/tests/e2e/Dockerfile
      target: releases
    volumes:
      - fixture-data:/tls
    networks:
      default:
        aliases: [github.com, api.github.com]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  bus:
  storage:
  database:
  fixture-data:
