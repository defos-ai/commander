name: Build test images
description: Build and load selected Compose images with a separate cache per image.

inputs:
  compose-file:
    description: Compose file containing the build targets.
    required: true
  targets:
    description: Comma-separated Compose build targets.
    required: true

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4
    - name: Configure build
      id: build
      shell: bash
      env:
        COMPOSE_PATH: ${{ inputs.compose-file }}
        TARGETS: ${{ inputs.targets }}
      run: |
        IFS=, read -ra targets <<< "$TARGETS"
        {
          echo "source=$(dirname "$COMPOSE_PATH")"
          echo "file=$(basename "$COMPOSE_PATH")"
          echo 'settings<<EOF'
          for target in "${targets[@]}"; do
            case "$target" in
              controller|api|mcp|minio|spawner-agent|fixture-releases|fixture-agent) scope="test-$target" ;;
              ui) scope=test-admin-ui ;;
              minio-init) scope=test-minio-client ;;
              *) echo "Unknown build target: $target" >&2; exit 1 ;;
            esac
            echo "$target.cache-from=type=gha,scope=$scope,timeout=2m"
            echo "$target.cache-to=type=gha,scope=$scope,mode=max,timeout=2m,ignore-error=true"
          done
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
    - uses: docker/bake-action@v7
      with:
        source: ${{ steps.build.outputs.source }}
        files: ${{ steps.build.outputs.file }}
        targets: ${{ inputs.targets }}
        load: true
        set: ${{ steps.build.outputs.settings }}
