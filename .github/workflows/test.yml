name: Tests

on:
  push:
    paths:
      - 'framework/**'
      - 'providers/**'
      - 'apps/**'
      - 'go.work'
      - 'go.work.sum'
      - 'compose*.yaml'
      - '.github/composes/**'
      - '.dockerignore'
      - '.github/actions/**'
      - '.github/workflows/**'
      - '.github/tests/**'
      - '!**/*.md'
  pull_request:
    paths:
      - 'framework/**'
      - 'providers/**'
      - 'apps/**'
      - 'go.work'
      - 'go.work.sum'
      - 'compose*.yaml'
      - '.github/composes/**'
      - '.dockerignore'
      - '.github/actions/**'
      - '.github/workflows/**'
      - '.github/tests/**'
      - '!**/*.md'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Duplicate push deliveries must finish without leaving canceled commit checks.
  group: tests-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    uses: ./.github/workflows/test-unit.yml

  integration:
    needs: unit
    uses: ./.github/workflows/test-integration.yml
