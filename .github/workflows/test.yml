name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        module:
          - framework
          - framework/tests
          - providers
          - apps/agents/web-quality
          - apps/controllers/default
          - apps/adapters/mcp
          - apps/playground

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Prepare browser tests
        if: matrix.module == 'apps/agents/web-quality' || matrix.module == 'apps/adapters/mcp' || matrix.module == 'apps/playground'
        shell: bash
        run: |
          if ! command -v google-chrome >/dev/null; then
            curl --fail --location --retry 3 https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o "$RUNNER_TEMP/commander-chrome.deb"
            sudo apt-get update
            sudo apt-get install -y "$RUNNER_TEMP/commander-chrome.deb"
          fi
          test -x "$(command -v google-chrome)"
          echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "CHROMIUM_NO_SANDBOX=true" >> "$GITHUB_ENV"

      - name: Test with race detector
        run: go test -race -count=1 ./${{ matrix.module }}/...

      - name: Vet
        run: go vet ./${{ matrix.module }}/...
