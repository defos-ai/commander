name: MCP tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: MCP against Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Start test stack
        run: docker compose -f compose.test.yaml up --build --wait
      - name: Run MCP tests
        run: go test -race -count=1 -timeout=5m -v ./apps/adapters/mcp/tests
      - name: Collect service logs
        if: failure()
        run: docker compose -f compose.test.yaml logs --no-color > "$RUNNER_TEMP/commander-compose.log"
      - name: Stop test stack
        if: always()
        run: docker compose -f compose.test.yaml down --volumes
      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-compose-logs
          path: ${{ runner.temp }}/commander-compose.log
          if-no-files-found: ignore
