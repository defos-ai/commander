name: Push commander-api

on:
  workflow_call:
    inputs:
      version:
        description: Released Commander version
        type: string
        required: true
    outputs:
      digest:
        description: Published image digest
        value: ${{ jobs.push.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  push:
    if: ${{ github.repository == 'defos-ai/commander' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: apps/adapters/api/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/defos-ai/commander-api:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
