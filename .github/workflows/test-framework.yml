name: Framework tests

on:
  push:
    paths:
      - 'framework/**'
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/test-framework.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'framework/**'
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/test-framework.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Framework tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Run framework tests with race detector
        run: go test -race -count=1 -timeout=3m ./framework/...
      - name: Vet framework
        run: go vet ./framework/...
