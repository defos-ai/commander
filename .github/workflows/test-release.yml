name: Release readiness tests

on:
  workflow_dispatch:
    inputs:
      version:
        description: Shared stable v0 or v1 version to validate
        type: string
        required: true
        default: v0.1.0
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Check all modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Run release readiness tests
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GOTOOLCHAIN: local
        run: go test -count=1 -failfast -timeout=10m -v ./.github/tests/release_test.go

  framework:
    needs: test
    uses: ./.github/workflows/test-framework.yml

  provider-fs:
    needs: test
    uses: ./.github/workflows/test-provider-fs.yml

  provider-mongo:
    needs: test
    uses: ./.github/workflows/test-provider-mongo.yml

  provider-rabbitmq:
    needs: test
    uses: ./.github/workflows/test-provider-rabbitmq.yml

  provider-s3:
    needs: test
    uses: ./.github/workflows/test-provider-s3.yml

  controller:
    needs: test
    uses: ./.github/workflows/test-controller.yml

  agent:
    needs: test
    uses: ./.github/workflows/test-agent.yml

  api:
    needs: test
    uses: ./.github/workflows/test-api.yml

  mcp:
    needs: test
    uses: ./.github/workflows/test-mcp.yml

  playground:
    needs: test
    uses: ./.github/workflows/test-playground.yml

  ui:
    needs: test
    uses: ./.github/workflows/test-ui.yml
