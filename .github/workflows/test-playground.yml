name: Playground tests

on:
  push:
    paths:
      - 'framework/**'
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - 'apps/playground/**'
      - 'apps/controllers/default/**'
      - 'apps/agents/web-quality/**'
      - 'apps/adapters/mcp/**'
      - 'providers/fs/**'
      - 'providers/mongo/**'
      - 'providers/s3/**'
      - '.github/workflows/test-playground.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'framework/**'
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - 'apps/playground/**'
      - 'apps/controllers/default/**'
      - 'apps/agents/web-quality/**'
      - 'apps/adapters/mcp/**'
      - 'providers/fs/**'
      - 'providers/mongo/**'
      - 'providers/s3/**'
      - '.github/workflows/test-playground.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playground tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Run Playground tests with race detector
        run: go test -race -count=1 -timeout=3m ./apps/playground/...
      - name: Vet Playground
        run: go vet ./apps/playground/...
