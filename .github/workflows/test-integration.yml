name: Integration tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  providers:
    name: Providers and controller integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: .github/composes/compose.providers.test.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Build MinIO images
        uses: ./.github/actions/build-test-images
        with:
          compose-file: .github/composes/compose.providers.test.yaml
          targets: minio,minio-init
      - name: Start provider services
        run: docker compose up --no-build --wait --wait-timeout 120 mongo rabbitmq minio
      - name: Initialize S3 bucket
        run: docker compose run --no-deps --rm minio-init
      - name: Test MongoDB provider
        env:
          COMMANDER_TEST_MONGO_URL: mongodb://127.0.0.1:27017/commander_mongo_tests?replicaSet=rs0&directConnection=true
        run: go test -race -count=1 -failfast -timeout=3m -v ./providers/mongo/...
      - name: Test controller startup with MongoDB
        env:
          COMMANDER_TEST_MONGO_URL: mongodb://127.0.0.1:27017/commander_mongo_tests?replicaSet=rs0&directConnection=true
        run: go test -race -count=1 -timeout=3m -v ./apps/controllers/default/tests -run '^TestCLIStartsWithMongo$'
      - name: Test RabbitMQ provider
        env:
          COMMANDER_TEST_RABBITMQ_URL: amqp://commander-test:commander-test-secret@127.0.0.1:5673/
        run: go test -race -count=1 -failfast -timeout=3m -v ./providers/rabbitmq/...
      - name: Test S3 provider
        env:
          COMMANDER_TEST_S3_URL: s3://commander-test/provider-tests
          AWS_ENDPOINT_URL_S3: http://127.0.0.1:9000
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: commander-test
          AWS_SECRET_ACCESS_KEY: commander-test-secret
          S3_USE_PATH_STYLE: 'true'
        run: go test -race -count=1 -failfast -timeout=3m -v ./providers/s3/...
      - name: Collect provider logs
        if: failure() || cancelled()
        run: |
          docker compose ps --all
          docker compose logs --no-color > "$RUNNER_TEMP/commander-providers.log"
      - name: Stop provider services
        if: always()
        run: docker compose down --volumes
      - name: Upload provider logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: provider-integration-logs
          path: ${{ runner.temp }}/commander-providers.log
          if-no-files-found: ignore

  stack:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: fs
            name: FS stack and browser
            compose-file: .github/composes/compose.test.yaml
            profiles: ui
            targets: controller,api,mcp,web-1,ui
            timeout-minutes: 20
          - backend: full
            name: Full stack
            compose-file: .github/composes/compose.full.test.yaml
            profiles: ''
            targets: controller,api,mcp,web-1,minio,minio-init
            timeout-minutes: 30
    env:
      COMPOSE_FILE: ${{ matrix.compose-file }}
      COMPOSE_PROFILES: ${{ matrix.profiles }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-node
        if: matrix.backend == 'fs'
      - name: Install Chromium
        if: matrix.backend == 'fs'
        working-directory: apps/admin/ui/frontend
        run: npx playwright install --with-deps chromium
      - name: Build test images
        uses: ./.github/actions/build-test-images
        with:
          compose-file: ${{ matrix.compose-file }}
          targets: ${{ matrix.targets }}
      - name: Start test stack
        run: docker compose up --no-build --wait --wait-timeout 180
      - name: Run API tests
        run: go test -race -count=1 -failfast -timeout=5m -v ./apps/adapters/api/tests
      - name: Run MCP tests
        run: go test -race -count=1 -failfast -timeout=5m -v ./apps/adapters/mcp/tests
      - name: Run browser tests
        if: matrix.backend == 'fs'
        working-directory: apps/admin/ui/frontend
        run: npm run test:e2e
      - name: Collect service logs
        if: failure() || cancelled()
        run: |
          docker compose ps --all
          docker compose logs --no-color > "$RUNNER_TEMP/commander-stack.log"
      - name: Stop test stack
        if: always()
        run: docker compose down --volumes
      - name: Upload service logs and browser results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: stack-integration-results-${{ matrix.backend }}
          path: |
            ${{ runner.temp }}/commander-stack.log
            apps/admin/ui/frontend/test-results/
            apps/admin/ui/frontend/playwright-report/
          if-no-files-found: ignore
