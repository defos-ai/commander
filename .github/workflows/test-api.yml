name: API tests

on:
  push:
    paths:
      - 'framework/**'
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - 'apps/adapters/api/**'
      - 'apps/adapters/mcp/**'
      - 'apps/controllers/default/**'
      - 'apps/agents/web-quality/**'
      - 'providers/fs/**'
      - 'providers/rabbitmq/**'
      - 'providers/mongo/**'
      - 'providers/s3/**'
      - 'compose.test.yaml'
      - 'compose.full.test.yaml'
      - '.dockerignore'
      - '.github/workflows/test-api.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'framework/**'
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - 'apps/adapters/api/**'
      - 'apps/adapters/mcp/**'
      - 'apps/controllers/default/**'
      - 'apps/agents/web-quality/**'
      - 'providers/fs/**'
      - 'providers/rabbitmq/**'
      - 'providers/mongo/**'
      - 'providers/s3/**'
      - 'compose.test.yaml'
      - 'compose.full.test.yaml'
      - '.dockerignore'
      - '.github/workflows/test-api.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: API against ${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: fs
            compose-file: compose.test.yaml
          - backend: full
            compose-file: compose.full.test.yaml
    env:
      COMPOSE_FILE: ${{ matrix.compose-file }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Vet API
        run: go vet ./apps/adapters/api/...
      - name: Start test stack
        run: docker compose up --build --wait --wait-timeout 120
      - name: Run API tests
        run: go test -race -count=1 -failfast -timeout=5m -v ./apps/adapters/api/...
      - name: Collect service logs
        if: failure() || cancelled()
        run: docker compose logs --no-color > "$RUNNER_TEMP/commander-api-compose.log"
      - name: Stop test stack
        if: always()
        run: docker compose down --volumes
      - name: Upload service logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-logs-${{ matrix.backend }}
          path: ${{ runner.temp }}/commander-api-compose.log
          if-no-files-found: ignore
