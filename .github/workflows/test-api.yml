name: API tests

on:
  push:
    paths:
      - 'framework/**'
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - 'apps/adapters/api/**'
      - 'apps/adapters/mcp/**'
      - 'apps/controllers/default/**'
      - 'apps/agents/web-quality/**'
      - 'providers/fs/**'
      - 'providers/rabbitmq/**'
      - 'providers/mongo/**'
      - 'providers/s3/**'
      - 'compose.test.yaml'
      - 'compose.full.test.yaml'
      - '.dockerignore'
      - '.github/workflows/test-api.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'framework/**'
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - 'apps/adapters/api/**'
      - 'apps/adapters/mcp/**'
      - 'apps/controllers/default/**'
      - 'apps/agents/web-quality/**'
      - 'providers/fs/**'
      - 'providers/rabbitmq/**'
      - 'providers/mongo/**'
      - 'providers/s3/**'
      - 'compose.test.yaml'
      - 'compose.full.test.yaml'
      - '.dockerignore'
      - '.github/workflows/test-api.yml'
      - '!**/*.md'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: API against ${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: fs
            compose-file: compose.test.yaml
            timeout-minutes: 10
          - backend: full
            compose-file: compose.full.test.yaml
            timeout-minutes: 30
    env:
      COMPOSE_FILE: ${{ matrix.compose-file }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Vet API
        run: go vet ./apps/adapters/api/...
      - uses: docker/setup-buildx-action@v4
      - name: Build Commander images
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ matrix.compose-file }}
          targets: controller,api,mcp,web-1
          load: true
          set: |
            controller.cache-from=type=gha,scope=test-controller,timeout=2m
            controller.cache-to=type=gha,scope=test-controller,mode=max,timeout=2m,ignore-error=true
            api.cache-from=type=gha,scope=test-api,timeout=2m
            api.cache-to=type=gha,scope=test-api,mode=max,timeout=2m,ignore-error=true
            mcp.cache-from=type=gha,scope=test-mcp,timeout=2m
            mcp.cache-to=type=gha,scope=test-mcp,mode=max,timeout=2m,ignore-error=true
            web-1.cache-from=type=gha,scope=test-web-quality-agent,timeout=2m
            web-1.cache-to=type=gha,scope=test-web-quality-agent,mode=max,timeout=2m,ignore-error=true
      - name: Build MinIO images
        if: matrix.backend == 'full'
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ matrix.compose-file }}
          targets: minio,minio-init
          load: true
          set: |
            minio.cache-from=type=gha,scope=test-minio,timeout=2m
            minio.cache-to=type=gha,scope=test-minio,mode=max,timeout=2m,ignore-error=true
            minio-init.cache-from=type=gha,scope=test-minio-client,timeout=2m
            minio-init.cache-to=type=gha,scope=test-minio-client,mode=max,timeout=2m,ignore-error=true
      - name: Start test stack
        run: docker compose up --no-build --wait --wait-timeout 120
      - name: Run API tests
        run: go test -race -count=1 -failfast -timeout=5m -v ./apps/adapters/api/...
      - name: Collect service logs
        if: failure() || cancelled()
        run: |
          docker compose ps --all
          docker compose logs --no-color > "$RUNNER_TEMP/commander-api-compose.log"
      - name: Stop test stack
        if: always()
        run: docker compose down --volumes
      - name: Upload service logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-logs-${{ matrix.backend }}
          path: ${{ runner.temp }}/commander-api-compose.log
          if-no-files-found: ignore
