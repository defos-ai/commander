name: S3 provider tests

on:
  push:
    paths:
      - 'framework/**'
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - 'providers/s3/**'
      - 'compose.full.yaml'
      - '.dockerignore'
      - '.github/workflows/test-provider-s3.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'framework/**'
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - 'providers/s3/**'
      - 'compose.full.yaml'
      - '.dockerignore'
      - '.github/workflows/test-provider-s3.yml'
      - '!**/*.md'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-provider-s3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: S3 provider tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMMANDER_TEST_S3_URL: "s3://commander/tests"
      AWS_ENDPOINT_URL_S3: "http://127.0.0.1:9000"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "commander"
      AWS_SECRET_ACCESS_KEY: "commander-local-secret"
      S3_USE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Vet S3 provider
        run: go vet ./providers/s3/...
      - name: Start MinIO
        run: docker compose -f compose.full.yaml up --build --wait --wait-timeout 90 minio
      - name: Initialize S3 bucket
        run: docker compose -f compose.full.yaml run --build --rm minio-init
      - name: Run S3 provider tests
        run: go test -race -count=1 -timeout=3m -v ./providers/s3/...
      - name: Collect MinIO logs
        if: failure() || cancelled()
        run: docker compose -f compose.full.yaml logs --no-color minio minio-init > "$RUNNER_TEMP/commander-s3.log"
      - name: Stop MinIO
        if: always()
        run: docker compose -f compose.full.yaml down --volumes
      - name: Upload MinIO logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: s3-provider-logs
          path: ${{ runner.temp }}/commander-s3.log
          if-no-files-found: ignore
