name: RabbitMQ provider tests

on:
  push:
    paths:
      - 'framework/**'
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - 'providers/rabbitmq/**'
      - '.github/workflows/test-provider-rabbitmq.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'framework/**'
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - 'providers/rabbitmq/**'
      - '.github/workflows/test-provider-rabbitmq.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: RabbitMQ provider tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMMANDER_TEST_RABBITMQ_URL: "amqp://commander:commander-test@127.0.0.1:5672/"
    services:
      rabbitmq:
        image: rabbitmq:4.2.9-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: commander
          RABBITMQ_DEFAULT_PASS: commander-test
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Vet RabbitMQ provider
        run: go vet ./providers/rabbitmq/...
      - name: Run RabbitMQ provider tests
        run: go test -race -count=1 -timeout=3m ./providers/rabbitmq/...
      - name: Collect RabbitMQ logs
        if: failure() || cancelled()
        run: docker logs '${{ job.services.rabbitmq.id }}' > "$RUNNER_TEMP/commander-rabbitmq.log" 2>&1
      - name: Upload RabbitMQ logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: rabbitmq-provider-logs
          path: ${{ runner.temp }}/commander-rabbitmq.log
          if-no-files-found: ignore
