name: Static checks

on:
  workflow_call:
    inputs:
      all:
        type: boolean
        default: false
      changes:
        type: string
        default: '[]'

permissions:
  contents: read

concurrency:
  # Keep the caller's scope while using a distinct group for this nested workflow.
  group: test-checks-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Framework and providers
    if: >-
      ${{ inputs.all || contains(fromJSON(inputs.changes), 'framework') ||
          contains(fromJSON(inputs.changes), 'fs') || contains(fromJSON(inputs.changes), 'mongo') ||
          contains(fromJSON(inputs.changes), 'rabbitmq') || contains(fromJSON(inputs.changes), 's3') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Build and vet framework outside the workspace
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'framework') }}
        working-directory: framework
        env:
          GOWORK: 'off'
        run: |
          go build ./...
          go vet ./...
      - name: Build and vet FS provider
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'fs') }}
        run: |
          go build ./providers/fs/...
          go vet ./providers/fs/...
      - name: Vet Mongo provider
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'mongo') }}
        run: go vet ./providers/mongo/...
      - name: Vet RabbitMQ provider
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'rabbitmq') }}
        run: go vet ./providers/rabbitmq/...
      - name: Vet S3 provider
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 's3') }}
        run: go vet ./providers/s3/...

  apps:
    name: Applications
    if: >-
      ${{ inputs.all || contains(fromJSON(inputs.changes), 'controller') ||
          contains(fromJSON(inputs.changes), 'builder') || contains(fromJSON(inputs.changes), 'spawner') ||
          contains(fromJSON(inputs.changes), 'playground') ||
          contains(fromJSON(inputs.changes), 'api') || contains(fromJSON(inputs.changes), 'mcp') ||
          contains(fromJSON(inputs.changes), 'admin') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMMANDER_TEST_MONGO_URL: ''
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Build and vet controller
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'controller') }}
        run: |
          go build ./apps/controllers/default/...
          go vet ./apps/controllers/default/...
      - name: Build and vet builder agent
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'builder') }}
        run: |
          go build ./apps/agents/builder/...
          go vet ./apps/agents/builder/...
      - name: Build and vet spawner packages
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'spawner') }}
        run: |
          go build ./apps/agents/spawner/...
          go vet ./apps/agents/spawner/...
      - name: Build and vet Playground, including all-in-one
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'playground') }}
        run: |
          go build ./apps/playground/...
          go vet ./apps/playground/...
      - name: Build API and vet adapter
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'api') }}
        run: |
          go build ./apps/adapters/api/...
          go vet ./apps/adapters/api/...
      - name: Build MCP and vet adapter
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'mcp') }}
        run: |
          go build ./apps/adapters/mcp/...
          go vet ./apps/adapters/mcp/...
      - name: Build and vet Admin
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'admin') }}
        working-directory: apps/admin
        run: |
          go build ./...
          go vet ./...

  frontend:
    name: Frontend and bundled hosts
    if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'frontend') || contains(fromJSON(inputs.changes), 'playground') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/admin/ui/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-go
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Build bundled Admin
        working-directory: apps/admin
        run: |
          cp -R ui/frontend/dist ui/backend/static/dist
          go build -tags embed_ui -trimpath -o "$RUNNER_TEMP/commander-admin" ./cmd/commander-admin
      - name: Build bundled Playground
        working-directory: .
        run: |
          go build -tags embed_ui -trimpath -o "$RUNNER_TEMP/commander" ./apps/playground/cmd/commander
