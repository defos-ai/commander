name: Unit tests

on:
  workflow_call:
    inputs:
      all:
        type: boolean
        default: false
      changes:
        type: string
        default: '[]'

permissions:
  contents: read

concurrency:
  # Keep the caller's scope while using a distinct group for this nested workflow.
  group: test-unit-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Framework and providers
    if: >-
      ${{ inputs.all || contains(fromJSON(inputs.changes), 'framework') ||
          contains(fromJSON(inputs.changes), 'fs') || contains(fromJSON(inputs.changes), 'mongo') ||
          contains(fromJSON(inputs.changes), 'rabbitmq') || contains(fromJSON(inputs.changes), 's3') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Test and vet framework outside the workspace
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'framework') }}
        working-directory: framework
        env:
          GOWORK: 'off'
        run: |
          go test -race -count=1 -timeout=3m ./...
          go vet ./...
      - name: Test and vet FS provider
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'fs') }}
        run: |
          go test -race -count=1 -timeout=3m ./providers/fs/...
          go vet ./providers/fs/...
      - name: Vet Mongo provider
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'mongo') }}
        run: go vet ./providers/mongo/...
      - name: Vet RabbitMQ provider
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'rabbitmq') }}
        run: go vet ./providers/rabbitmq/...
      - name: Vet S3 provider
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 's3') }}
        run: go vet ./providers/s3/...

  apps:
    name: Applications
    if: >-
      ${{ inputs.all || contains(fromJSON(inputs.changes), 'controller') ||
          contains(fromJSON(inputs.changes), 'builder') || contains(fromJSON(inputs.changes), 'spawner') ||
          contains(fromJSON(inputs.changes), 'playground') ||
          contains(fromJSON(inputs.changes), 'api') || contains(fromJSON(inputs.changes), 'mcp') ||
          contains(fromJSON(inputs.changes), 'ui-backend') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMMANDER_TEST_MONGO_URL: ''
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Test and vet controller
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'controller') }}
        run: |
          go test -race -count=1 -timeout=3m ./apps/controllers/default/...
          go vet ./apps/controllers/default/...
      - name: Test and vet builder agent
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'builder') }}
        run: |
          go test -race -count=1 -timeout=3m ./apps/agents/builder/...
          go vet ./apps/agents/builder/...
      - name: Test and vet spawner packages
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'spawner') }}
        run: |
          go test -race -count=1 -timeout=3m ./apps/agents/spawner/...
          go vet ./apps/agents/spawner/...
      - name: Test and vet Playground, including all-in-one
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'playground') }}
        run: |
          go test -race -count=1 -timeout=3m ./apps/playground/...
          go vet ./apps/playground/...
      - name: Test API host and vet adapter
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'api') }}
        run: |
          go test -race -count=1 -timeout=3m ./apps/adapters/api/tests/host/...
          go vet ./apps/adapters/api/...
      - name: Test MCP host and vet adapter
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'mcp') }}
        run: |
          go test -race -count=1 -timeout=3m ./apps/adapters/mcp/tests/host/...
          go vet ./apps/adapters/mcp/...
      - name: Test and vet UI backend outside the workspace
        if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'ui-backend') }}
        working-directory: apps/admin/ui/backend
        env:
          GOWORK: 'off'
        run: |
          go test -race -count=1 -timeout=1m ./...
          go vet ./...

  frontend:
    name: Frontend and bundled hosts
    if: ${{ inputs.all || contains(fromJSON(inputs.changes), 'frontend') || contains(fromJSON(inputs.changes), 'playground') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/admin/ui/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-go
      - name: Typecheck
        run: npm run typecheck
      - name: Test UI behavior
        run: npm test
      - name: Build
        run: npm run build
      - name: Test and build bundled UI
        working-directory: apps/admin/ui/backend
        env:
          GOWORK: 'off'
        run: |
          cp -R ../frontend/dist static/dist
          go test -tags embed_ui -race -count=1 -timeout=1m ./tests -run '^TestBundledFrontend$'
          go build -tags embed_ui -trimpath -o "$RUNNER_TEMP/commander-ui" ./cmd/commander-ui
      - name: Test and build bundled Playground
        working-directory: .
        run: |
          go test -tags embed_ui -race -count=1 -timeout=3m ./apps/playground/tests -run '^TestAllInOneBundledAdmin$'
          go build -tags embed_ui -trimpath -o "$RUNNER_TEMP/commander" ./apps/playground/cmd/commander
