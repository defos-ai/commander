name: Build native binaries

on:
  workflow_call:
    inputs:
      version:
        description: Commander release version
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }} / ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, runner: ubuntu-24.04}
          - {goos: linux, goarch: arm64, runner: ubuntu-24.04-arm}
          - {goos: darwin, goarch: amd64, runner: macos-15-intel}
          - {goos: darwin, goarch: arm64, runner: macos-15}
          - {goos: windows, goarch: amd64, runner: windows-2025}
          - {goos: windows, goarch: arm64, runner: windows-11-arm}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - uses: ./.github/actions/setup-node
      - name: Build bundled Admin frontend
        run: npm --prefix apps/admin/ui/frontend run build -- --outDir ../backend/static/dist --emptyOutDir
      - name: Test native environment and all-in-one hosts
        run: |
          go test -count=1 -timeout=3m ./framework/tests/agent/environment
          go test -count=1 -timeout=3m ./framework/tests/agent/manifest
          go test -count=1 -timeout=3m ./apps/agents/spawner/...
          go test -tags embed_ui -count=1 -timeout=3m ./apps/playground/tests -run '^TestAllInOne'
      - name: Build Commander, spawner and builder
        id: build
        run: |
          suffix="${GOOS}_${GOARCH}"
          if [[ "$GOOS" == windows ]]; then suffix+=.exe; fi
          mkdir -p dist
          go build -tags embed_ui -trimpath -buildvcs=false -ldflags='-s -w' -o "dist/commander_$suffix" ./apps/playground/cmd/commander
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o "dist/commander-spawner-agent_$suffix" ./apps/agents/spawner/cmd
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o "dist/commander-builder-agent_$suffix" ./apps/agents/builder/cmd
          "./dist/commander_$suffix" --help
          "./dist/commander-spawner-agent_$suffix" --help
          "./dist/commander-builder-agent_$suffix" --help
      - uses: actions/upload-artifact@v4
        with:
          name: commander-native-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
