name: Make release
run-name: Release Commander ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Shared stable v0 or v1 version
        type: string
        required: true
        default: v0.2.0

permissions:
  contents: read

concurrency:
  group: commander-release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test-release.yml
    with:
      version: ${{ inputs.version }}

  binaries:
    needs: test
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ inputs.version }}

  publish:
    name: Tag all modules
    needs: [test, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false
      - name: Publish tags together
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GOTOOLCHAIN: local
        run: |
          modules=$(go work edit -json | jq -r '.Use[].DiskPath')
          tags=("$VERSION")
          while IFS= read -r directory; do
            tags+=("${directory#./}/$VERSION")
          done <<< "$modules"

          refs=()
          for tag in "${tags[@]}"; do
            git tag "$tag" "$GITHUB_SHA"
            refs+=("refs/tags/$tag:refs/tags/$tag")
          done
          git push --atomic origin "${refs[@]}"

  api:
    needs: publish
    uses: ./.github/workflows/push-api.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ inputs.version }}

  admin:
    needs: publish
    uses: ./.github/workflows/push-admin.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ inputs.version }}

  mcp:
    needs: publish
    uses: ./.github/workflows/push-mcp.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ inputs.version }}

  controllers:
    needs: publish
    uses: ./.github/workflows/push-controllers.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ inputs.version }}

  agents:
    needs: publish
    uses: ./.github/workflows/push-agents.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ inputs.version }}

  aio:
    needs: publish
    uses: ./.github/workflows/push-aio.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ inputs.version }}

  playground:
    needs: publish
    uses: ./.github/workflows/push-playground.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ inputs.version }}

  release:
    needs: [publish, api, admin, mcp, controllers, agents, aio, playground]
    uses: ./.github/workflows/push-binaries.yml
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      builder-digest: ${{ needs.agents.outputs.builder-digest }}
      spawner-digest: ${{ needs.agents.outputs.spawner-digest }}

  stable:
    needs: [release, api, admin, mcp, controllers, agents, aio, playground]
    uses: ./.github/workflows/push-stable.yml
    permissions:
      contents: write
      packages: write
    with:
      version: ${{ inputs.version }}
      images: |
        {
          "commander-api": "${{ needs.api.outputs.digest }}",
          "commander-admin": "${{ needs.admin.outputs.digest }}",
          "commander-mcp": "${{ needs.mcp.outputs.digest }}",
          "commander-controller": "${{ needs.controllers.outputs.digest }}",
          "commander-builder-agent": "${{ needs.agents.outputs.builder-digest }}",
          "commander-spawner-agent": "${{ needs.agents.outputs.spawner-digest }}",
          "commander-aio": "${{ needs.aio.outputs.digest }}",
          "commander-playground": "${{ needs.playground.outputs.digest }}"
        }
