name: Make release
run-name: Release Commander ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Shared stable v0 or v1 version
        type: string
        required: true
        default: v0.1.0

permissions:
  contents: read

concurrency:
  group: commander-release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test-release.yml
    with:
      version: ${{ inputs.version }}

  publish:
    name: Tag all modules
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false
      - name: Publish tags together
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GOTOOLCHAIN: local
        run: |
          modules=$(go work edit -json | jq -r '.Use[].DiskPath')
          tags=("$VERSION")
          while IFS= read -r directory; do
            tags+=("${directory#./}/$VERSION")
          done <<< "$modules"

          refs=()
          for tag in "${tags[@]}"; do
            git tag "$tag" "$GITHUB_SHA"
            refs+=("refs/tags/$tag:refs/tags/$tag")
          done
          git push --atomic origin "${refs[@]}"
