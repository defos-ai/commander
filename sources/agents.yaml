schema_version: 1
agents:
  builder:
    description: Builds Commander agents with Codex, validates and exports source, and publishes reviewed source artifacts to GitHub.
    source: github.com/defos-ai/commander/apps/agents/builder@stable
    visibility: public
  spawner:
    description: Installs Commander agents from GitHub packages and launches them as native processes, Docker containers, or Kubernetes pods.
    source: github.com/defos-ai/commander/apps/agents/spawner@stable
    visibility: public
  browser:
    description: Smart, dedicated browser agent for navigating web applications, inspecting rendered pages, and capturing screenshots.
    source: github.com/defos-ai/commander-browser-agent@stable
    visibility: public
  example:
    description: Demonstrates Commander agent actions as a template for developing custom agents.
    source: github.com/defos-ai/commander-example-agent@stable
    visibility: public
  cybersec:
    description: Comprehensive security agent for red and blue teaming, vulnerability discovery, exploitability validation, and remediation prioritization.
    source: github.com/defos-ai/cybersec-agent@stable
    visibility: private
  fixer:
    description: Fixes vulnerabilities in source code and prepares remediation patches.
    source: github.com/defos-ai/fixer-agent@stable
    visibility: private
  log-observer:
    description: Observes application, infrastructure, and security logs, correlates anomalies, and reports findings for investigation.
    source: github.com/defos-ai/log-observer-agent@stable
    visibility: private
  exposure-monitor:
    description: Protects internet-facing resources by identifying exposures and coordinating remediation.
    source: github.com/defos-ai/exposure-monitor-agent@stable
    visibility: private
  identity-guard:
    description: Identifies accounts with leaked credentials and revokes their access.
    source: github.com/defos-ai/identity-guard-agent@stable
    visibility: private
  mail-filter:
    description: Detects and blocks phishing and malware in inbound email.
    source: github.com/defos-ai/mail-filter-agent@stable
    visibility: private
