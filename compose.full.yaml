name: commander-full

x-environment: &environment
  BUS_URL: ${BUS_URL:-amqp://${RABBITMQ_USER:-commander}:${RABBITMQ_PASSWORD:-commander-local-secret}@rabbitmq:5672/}
  STORAGE_URL: ${STORAGE_URL:-s3://commander}
  AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-http://minio:9000}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-commander}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-commander-local-secret}
  S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}

x-runtime: &runtime
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-agent: &agent
  <<: *runtime
  shm_size: 256mb
  image: commander-web-quality-agent:local
  pull_policy: never
  environment:
    <<: *environment
    CHROMIUM_NO_SANDBOX: "true"
  depends_on:
    controller:
      condition: service_started
    rabbitmq:
      condition: service_healthy

services:
  rabbitmq:
    image: rabbitmq:4.2.9-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-commander}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-commander-local-secret}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 10s

  mongo:
    image: mongo:8.0.32
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      # Avoid MongoDB TCMalloc crashes on newer kernels: SERVER-121912.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status(); }
          catch (error) {
            if (error.codeName !== "NotYetInitialized") throw error;
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]});
          }
          quit(db.hello().isWritablePrimary ? 0 : 1);
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 5s

  minio:
    image: commander-minio:local
    build:
      context: ./providers/s3/tests/minio
      target: minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # Local development credentials; hosting supplies its own credentials.
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-commander}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-commander-local-secret}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 5s

  minio-init:
    image: commander-minio-client:local
    build:
      context: ./providers/s3/tests/minio
      target: mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-commander}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-commander-local-secret}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$AWS_ACCESS_KEY_ID" "$$AWS_SECRET_ACCESS_KEY"
        mc mb --ignore-existing local/commander

  controller:
    <<: *runtime
    image: commander-controller:local
    pull_policy: never
    build:
      context: .
      dockerfile: apps/controllers/default/docker/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command:
      - --with-missions=/data/default-missions.json
    configs:
      - source: default-missions
        target: /data/default-missions.json
    environment:
      <<: *environment
      DATABASE_URL: ${DATABASE_URL:-mongodb://mongo:27017/commander?replicaSet=rs0}

  mcp:
    <<: *runtime
    image: commander-mcp:local
    pull_policy: never
    build:
      context: .
      dockerfile: apps/adapters/mcp/docker/Dockerfile
    command:
      - --listen-address=:4273
      - --allowed-hosts=localhost,127.0.0.1,::1,mcp
    environment:
      <<: *environment
      DATABASE_URL: ${DATABASE_URL:-mongodb://mongo:27017/commander?replicaSet=rs0}
    ports:
      - "127.0.0.1:${COMMANDER_MCP_PORT:-4273}:4273"
    depends_on:
      controller:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:4273/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    <<: *runtime
    profiles: [admin]
    image: commander-api:local
    pull_policy: never
    build:
      context: .
      dockerfile: apps/adapters/api/docker/Dockerfile
    environment:
      <<: *environment
      DATABASE_URL: ${DATABASE_URL:-mongodb://mongo:27017/commander?replicaSet=rs0}
      API_USERNAME: ${API_USERNAME:-commander}
      API_PASSWORD: ${API_PASSWORD:-commander-local-secret}
      API_LISTEN_ADDRESS: 0.0.0.0:4274
      API_ALLOWED_HOSTS: ${API_ALLOWED_HOSTS:-localhost,127.0.0.1,::1,api}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-http://localhost:${COMMANDER_UI_PORT:-4275},http://127.0.0.1:${COMMANDER_UI_PORT:-4275}}
      API_SWAGGER_ENABLED: ${API_SWAGGER_ENABLED:-false}
    ports:
      - "127.0.0.1:${COMMANDER_API_PORT:-4274}:4274"
    depends_on:
      controller:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:4274/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  ui:
    <<: *runtime
    read_only: true
    profiles: [admin]
    image: commander-admin-ui:local
    pull_policy: never
    build:
      context: .
      dockerfile: apps/admin/ui/docker/Dockerfile
    environment:
      UI_PUBLIC_ORIGIN: ${UI_PUBLIC_ORIGIN:-}
      UI_API_UPSTREAMS: localhost:${COMMANDER_API_PORT:-4274}=api:4274,127.0.0.1:${COMMANDER_API_PORT:-4274}=api:4274
    ports:
      - "127.0.0.1:${COMMANDER_UI_PORT:-4275}:4275"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--timeout=2", "http://127.0.0.1:4275/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web-1:
    <<: *agent
    # Build the shared image once; web-2 uses the same image.
    build:
      context: .
      dockerfile: apps/agents/web-quality/docker/Dockerfile

  web-2:
    <<: *agent

  playground:
    profiles: [playground]
    build:
      context: .
      dockerfile: apps/playground/docker/Dockerfile
    init: true
    stdin_open: true
    tty: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      COMMANDER_MCP_URL: http://mcp:4273/mcp
      COMMANDER_LLM_PROVIDER: ${COMMANDER_LLM_PROVIDER:-}
      COMMANDER_LLM_MODEL: ${COMMANDER_LLM_MODEL:-}
      COMMANDER_LLM_BASE_URL: ${COMMANDER_LLM_BASE_URL:-}
      COMMANDER_LLM_API_KEY: ${COMMANDER_LLM_API_KEY:-}
      COMMANDER_DEBUG: ${COMMANDER_DEBUG:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      NO_COLOR: ${NO_COLOR:-}
      TERM: ${TERM:-xterm-256color}
    depends_on:
      mcp:
        condition: service_healthy
      web-1:
        condition: service_started
      web-2:
        condition: service_started

volumes:
  rabbitmq:
  minio:
  mongo:

configs:
  default-missions:
    file: ./apps/controllers/default/data/default-missions.json
